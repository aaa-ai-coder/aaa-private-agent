name = "aaa-supabase-keepalive"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Keep the Supabase project awake and snapshot the DB to R2 daily.
[triggers]
crons = ["*/5 * * * *"]

# Heavy file storage: logical DB backups land under db-backup/
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "aaa-r2"

# Public (non-secret) config. The service_role key is injected as a secret:
#   wrangler secret put SUPABASE_SERVICE_ROLE
[vars]
