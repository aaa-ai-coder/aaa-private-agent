name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate local credentials file
        run: |
          cp lib/config/credentials.example.dart lib/config/credentials.dart
          # If the repo owner has configured the corresponding GitHub secrets,
          # substitute real values so the release APK is fully functional.
          if [ -n "${{ secrets.R2_ACCOUNT_ID }}" ]; then
            sed -i "s|your_cloudflare_account_id|${{ secrets.R2_ACCOUNT_ID }}|" lib/config/credentials.dart
            sed -i "s|your_cloudflare_email|${{ secrets.R2_AUTH_EMAIL }}|" lib/config/credentials.dart
            sed -i "s|your_cloudflare_api_key|${{ secrets.R2_GLOBAL_KEY }}|" lib/config/credentials.dart
            sed -i "s|your_cloudflare_api_token|${{ secrets.R2_API_TOKEN }}|" lib/config/credentials.dart
            sed -i "s|aaa-r2|${{ secrets.R2_BUCKET_NAME }}|" lib/config/credentials.dart
          fi

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass privateagent123 -keypass privateagent123 -dname "CN=AAA Private Agent, OU=Agent, O=AAA, L=City, S=State, C=US"

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"844358886395","project_id":"aaa-private-agent","storage_bucket":"aaa-private-agent.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:844358886395:android:a1b2c3d4e5f6g7h8","android_client_info":{"package_name":"com.aaa.privateagent"}},"oauth_client":[{"client_id":"844358886395-tsh4o7eo55r14e6cbrs6oc1faisu6l33.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"AIzaSyDummyKeyForAAAAppBuild123456"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

      - name: Download bundled on-device AI model
        run: |
          mkdir -p assets/models
          EXPECTED=650379104
          MODEL_FILE=assets/models/qwen2.5-0.5b-instruct-q6_k.gguf
          for url in \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q6_k.gguf" \
            "https://modelscope.cn/models/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/master/qwen2.5-0.5b-instruct-q6_k.gguf"; do
            echo "Downloading on-device AI model from: $url"
            if curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 -o "$MODEL_FILE" "$url"; then
              break
            fi
          done
          SIZE=$(stat -c%s "$MODEL_FILE")
          echo "Downloaded model size: $SIZE bytes (expected $EXPECTED)"
          if [ "$SIZE" -lt $((EXPECTED - 1000000)) ]; then
            echo "Model download looks wrong (too small). Aborting build."
            exit 1
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AAA-Private-Agent.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAA-Private-Agent-APK
          path: build/app/outputs/flutter-apk/AAA-Private-Agent.apk

      - name: Get current date for release tag
        id: date
        run: echo "tag=build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/AAA-Private-Agent.apk
          name: "AAA Private Agent ${{ steps.date.outputs.tag }}"
          tag_name: ${{ steps.date.outputs.tag }}
          body: |
            ## AAA Private Agent APK
            
            Latest build from main branch.
            
            📱 **How to install on your phone:**
            1. Download this APK from the release page
            2. Open the downloaded file on your Android phone
            3. Tap "Install Anyway" if Play Protect shows a warning
            4. Open the app and enjoy!
            
            Release: ${{ steps.date.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
